name: acoustic_metamaterial
description: >
  Multi-layer acoustic metamaterial absorber for broadband sound absorption.
  The design consists of 4 layers with cavities and perforated plates.
  Design parameters control cavity depths (8 per layer × 2 layers = 16),
  pore sizes (8 across layers), perforation ratios (4), layer thickness
  ratios (2), and total thickness (1). The surrogate model predicts the
  absorption coefficient spectrum from 0 to 2000 Hz (100 points).

