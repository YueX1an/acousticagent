name: airfoil_cst
description: >
  CST-parameterized airfoil shape optimization at Reynolds number 100,000.
  The Class-Shape Transformation (CST) method parameterizes the airfoil
  surface using 8 Bernstein polynomial coefficients, plus Angle of Attack (AoA).
  The output is lift coefficient (Cl) and drag coefficient (Cd).
  The design goal is to maximize the lift-to-drag ratio (Cl/Cd).
  Dataset: 2,900 airfoils × 13 AoA angles = 28,832 valid samples
  after filtering (Cl>0, Cd>0.0001).

input_dim: 9
output_dim: 2

param_names:
  - CST_1
  - CST_2
  - CST_3
  - CST_4
  - CST_5
  - CST_6
  - CST_7
  - CST_8
  - AoA

param_bounds:
  - [-0.5, 0.5]
  - [-0.5, 0.5]
  - [-0.5, 0.5]
  - [-0.5, 0.5]
  - [-0.5, 0.5]
  - [-0.5, 0.5]
  - [-0.5, 0.5]
  - [-0.5, 0.5]
  - [-4.0, 8.0]

constrained_indices: [8]

output_type: vector
output_labels:
  - Cl
  - Cd

physical_constraints:
  - Cl_greater_than_zero
  - Cd_greater_than_zero
  - Cl_over_Cd_physically_reasonable

optimization_goal: maximize_ratio

critic_n_bands: 2
critic_band_labels:
  - Cl
  - Cd

target_metrics:
  min_Cl: 0.8
  max_Cd: 0.05

init_strategies:
  - default
  - random

hidden_dim: 512
num_blocks: 4
